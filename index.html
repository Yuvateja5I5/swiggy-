<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <style>
        *{
            padding:2px;
            margin: 2px;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bolder;
        }
        #navbar{
            height: 75px;
            display: flex;
            justify-content:space-between;
            align-items:center;
            background-color: rgba(255, 81, 0, 0.985);
            border-radius: 15px;
            
        }
        #head{

            width: 600px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #navbar img{
            height: 70px;
        }
        #head a{
            text-decoration: none;
            color: black;
        }
        #search input{
            padding:10px;
            width:400px;
            border-radius:40px;
            
        }
        #head a:hover{
            color:white;
        }
        #btn button{
            width:70px;
            border-radius: 10px;
            background-color:orangered;
            color: black;
           
        }
        #btn button:hover{
            color: whitesmoke;
        }
        
       #container{
        height: 80vh;

        justify-content: space-around;
        align-items: center;
        background-color:lightgray;
        border-radius: 15px;

        border-radius: 25px;

    }
    .boxes{
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: column;
        background-color: gray;
        border-radius:20px;
        box-shadow:10px 10px 10px rgb(58, 54, 50)
        
    }
    .boxes button:hover{
        color: white;
    }
    </style>
</head>
